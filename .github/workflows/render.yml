name: Render posters
on:
  push:
    paths: ["posters/**", "template/**", "render.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fonts
        run: |
          mkdir -p fonts
          for w in Regular Medium Bold; do curl -sSL -o fonts/Poppins-$w.ttf https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-$w.ttf; done
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core >/dev/null
      - name: Render
        run: |
          pip install -q pillow
          python render.py
      - name: Commit
        run: |
          git config user.name "taxora-bot"
          git config user.email "taxora-bot@users.noreply.github.com"
          git add out
          git diff --cached --quiet || (git commit -m "Render posters [skip ci]" && git pull --rebase && git push)
